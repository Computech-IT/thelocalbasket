<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice - The Local Basket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; font-family: 'Inter', sans-serif; }
        .invoice-box {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        .invoice-header { border-bottom: 2px solid #198754; padding-bottom: 20px; margin-bottom: 30px; }
        .table th { background: #f8f9fa; color: #555; font-weight: 600; }
        .total-row { font-size: 1.25rem; font-weight: 700; color: #198754; }
        @media print {
            body { background: #fff; }
            .invoice-box { box-shadow: none; margin: 0; padding: 20px; max-width: 100%; border: none; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="d-flex justify-content-end mt-4 mb-2 no-print gap-2">
        <button class="btn btn-outline-secondary" onclick="window.close()">Close</button>
        <button class="btn btn-dark" onclick="window.print()">🖨️ Print / Save as PDF</button>
    </div>

    <div class="invoice-box" id="invoiceContent">
        <div class="text-center py-5">
            <div class="spinner-border text-success"></div>
            <p class="mt-2 text-muted">Generating Invoice...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');
        if (!orderId) {
            document.getElementById('invoiceContent').innerHTML = "<div class='alert alert-danger'>Invalid Invoice Link</div>";
            return;
        }

        try {
            const res = await fetch(`/api/customer/orders/${orderId}`);
            const data = await res.json();
            
            if (!res.ok) throw new Error(data.error || "Failed to load");

            let subtotal = 0;
            const itemsHtml = data.items.map(item => {
                const itemTotal = parseFloat(item.total_price);
                subtotal += itemTotal;
                return `
                    <tr>
                        <td>${item.product_name}</td>
                        <td class="text-center">${item.qty}</td>
                        <td class="text-end">₹${parseFloat(item.unit_price || 0).toFixed(2)}</td>
                        <td class="text-end fw-semibold">₹${itemTotal.toFixed(2)}</td>
                    </tr>
                `;
            }).join("");

            document.getElementById('invoiceContent').innerHTML = `
                <div class="invoice-header d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="fw-bold text-success mb-0">The Local Basket</h2>
                        <p class="text-muted mb-0">Premium Curated Goods</p>
                    </div>
                    <div class="text-end">
                        <h1 class="text-uppercase text-muted" style="letter-spacing: 2px;">Invoice</h1>
                        <p class="mb-0"><strong>ID:</strong> ${data.invoice_id}</p>
                        <p class="mb-0"><strong>Date:</strong> ${new Date(data.date).toLocaleDateString()}</p>
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-sm-6">
                        <h6 class="text-muted text-uppercase mb-2">Billed To:</h6>
                        <h5 class="mb-1">${data.customer.full_name || "Valued Customer"}</h5>
                        <p class="mb-0 text-muted">${data.customer.email}</p>
                        <p class="mb-0 text-muted">${data.customer.phone || ""}</p>
                    </div>
                    <div class="col-sm-6 text-sm-end mt-4 mt-sm-0">
                        <h6 class="text-muted text-uppercase mb-2">Payment Status:</h6>
                        <h5 class="text-success mb-1">Paid Successfully</h5>
                        <p class="text-muted small mb-0">Razorpay Auth</p>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-borderless table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Item Description</th>
                                <th class="text-center">Qty</th>
                                <th class="text-end">Rate</th>
                                <th class="text-end">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itemsHtml}
                        </tbody>
                        <tfoot class="border-top border-dark">
                            <tr>
                                <td colspan="3" class="text-end pt-4"><strong>Grand Total:</strong></td>
                                <td class="text-end pt-4 total-row">₹${subtotal.toFixed(2)}</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <div class="text-center mt-5 pt-4 text-muted border-top border-light">
                    <p class="mb-1 fw-medium text-dark">Thank you for shopping local!</p>
                    <p class="small">If you have any questions concerning this invoice, contact support@thelocalbasket.in</p>
                </div>
            `;
        } catch (e) {
            document.getElementById('invoiceContent').innerHTML = `<div class='alert alert-danger'>${e.message}</div>`;
        }
    });
</script>

</body>
</html>
