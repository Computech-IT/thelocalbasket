<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - The Local Basket</title>
    <link rel="icon" type="image/png" href="/images/logo.PNG">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.min.css">
    <style>
        .profile-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .auth-card { background: var(--color-surface); padding: 40px; border-radius: var(--radius-lg); box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .nav-tabs .nav-link { color: var(--color-text-muted); border: none; border-bottom: 2px solid transparent; font-weight: 500; }
        .nav-tabs .nav-link.active { color: var(--color-text-main); border-bottom-color: var(--color-text-main); background: transparent; }
        .order-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 20px; margin-bottom: 20px; }
        .order-meta { font-size: 0.85rem; color: var(--color-text-muted); }
        .wishlist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg myNav sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-basket2-fill"></i> The Local Basket
            </a>
            <a href="/" class="btn btn-outline-dark btn-sm rounded-pill px-4 ms-auto">Back to Shop</a>
        </div>
    </nav>

    <div class="container profile-container" id="appRoot">
        <div class="text-center py-5">
            <div class="spinner-border text-dark" role="status"></div>
        </div>
    </div>

    <!-- Bottom Navigation for Mobile -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <i class="bi bi-house-door"></i>
            <span>Home</span>
        </a>
        <a href="/#featured" class="nav-item">
            <i class="bi bi-search"></i>
            <span>Explore</span>
        </a>
        <a href="/#cartModal" class="nav-item">
            <i class="bi bi-bag"></i>
            <span>Cart</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <i class="bi bi-person-fill"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/customer.obf.js"></script>
</body>
</html>
